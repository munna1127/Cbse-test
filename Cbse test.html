<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Chemistry Mock - Advanced</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.container{
max-width:1000px;
margin:20px auto;
padding:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:15px;
}

#timer{
text-align:center;
color:#00ffcc;
font-weight:bold;
margin-bottom:10px;
}

.option{
display:block;
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
}

.option.selected{ background:#0072ff; }
.option.correct{ background:green !important; }
.option.wrong{ background:red !important; }

.nav{
text-align:center;
margin-top:10px;
}

.nav button{
padding:8px 15px;
margin:5px;
border:none;
border-radius:6px;
background:#0072ff;
color:white;
cursor:pointer;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
border-radius:8px;
padding:5px;
}

.answer-box{
margin-top:8px;
padding:8px;
background:rgba(0,255,0,0.15);
border-radius:6px;
display:none;
}

.result{
text-align:center;
font-size:18px;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>CBSE Class 12 Chemistry Mock Test</h2>
<div id="timer">Time Left: 45:00</div>

<h3 id="question"></h3>
<div id="options"></div>
<textarea id="writtenAnswer" style="display:none;"></textarea>

<div class="answer-box" id="modelAnswer"></div>

<div class="nav">
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="showAnswer()">View Answer</button>
<button onclick="submitTest()">Submit</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

// ===== DATA =====

let mcqQuestions = [
{q:"IUPAC name of CH3COOH?",options:["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],answer:1},
{q:"Maximum oxidation state of Mn?",options:["+2","+4","+7","+3"],answer:2},
{q:"Unit of molar conductivity?",options:["Ohm","S cm² mol⁻¹","Volt","Ampere"],answer:1},
{q:"Nernst equation is?",options:["E=E°-0.0591/n logQ","PV=nRT","V=IR","H=U+PV"],answer:0},
{q:"Strongest reducing agent?",options:["Li","Na","K","Rb"],answer:0},
{q:"Hydrogen bonding present in?",options:["CH4","NH3","CO2","CCl4"],answer:1},
{q:"Hybridisation of ethene?",options:["sp","sp2","sp3","sp3d"],answer:1},
{q:"pH of neutral solution?",options:["5","6","7","8"],answer:2},
{q:"Primary amine?",options:["R-NH2","R2NH","R3N","R4N+"],answer:0},
{q:"Oxidation number of S in H2SO4?",options:["+4","+6","+2","+8"],answer:1},
{q:"Electrophile?",options:["NO2+","Cl-","OH-","CN-"],answer:0},
{q:"First order rate law?",options:["k[A]","k[A]2","k[A][B]","k"],answer:0},
{q:"Coordination number in [Co(NH3)6]3+?",options:["4","2","6","3"],answer:2},
{q:"Not colligative property?",options:["Osmotic pressure","Vapour density","Boiling elevation","Freezing depression"],answer:1},
{q:"Esterification gives?",options:["Salt","Ester+Water","Aldehyde","Ketone"],answer:1},
{q:"Strongest acid?",options:["HClO","HClO2","HClO3","HClO4"],answer:3},
{q:"Shape of SF6?",options:["Tetrahedral","Trigonal","Octahedral","Square planar"],answer:2},
{q:"SN1 occurs in?",options:["Tertiary halide","Primary halide","Methyl","All"],answer:0},
{q:"Zero order unit?",options:["mol L⁻¹ s⁻¹","s⁻¹","L mol⁻¹ s⁻¹","mol⁻²"],answer:0},
{q:"Aromatic compound?",options:["Benzene","Cyclohexane","Propane","Ethene"],answer:0}
];

let twoMarksQuestions = [
{q:"Define rate of reaction.",answer:"Rate of reaction is change in concentration of reactant or product per unit time."},
{q:"What are haloalkanes?",answer:"Haloalkanes are organic compounds in which hydrogen atom of alkane is replaced by halogen. Example: CH3Cl."},
{q:"State Nernst equation.",answer:"E = E° − (0.0591/n) log Q"},
{q:"Define electrochemical series.",answer:"It is arrangement of electrodes in order of increasing standard reduction potential."},
{q:"What is hybridisation?",answer:"Hybridisation is mixing of atomic orbitals to form new hybrid orbitals of equal energy."},
{q:"Define colligative properties.",answer:"Properties that depend only on number of solute particles not on their nature."},
{q:"What is SN1 reaction?",answer:"SN1 is unimolecular nucleophilic substitution reaction occurring in two steps."},
{q:"What is hydrogen bonding?",answer:"Attractive force between hydrogen attached to electronegative atom and another electronegative atom."},
{q:"Define oxidation number.",answer:"Oxidation number is hypothetical charge assigned to atom in a molecule."},
{q:"What is adsorption?",answer:"Accumulation of molecules on surface of a solid or liquid."}
];

let allQuestions = [...mcqQuestions, ...twoMarksQuestions];

let current=0;
let userAnswers=new Array(allQuestions.length).fill(null);
let submitted=false;

// ===== LOAD QUESTION =====

function loadQuestion(){
let q=allQuestions[current];
document.getElementById("question").innerText=(current+1)+". "+q.q;
document.getElementById("modelAnswer").style.display="none";

if(current < mcqQuestions.length){
document.getElementById("writtenAnswer").style.display="none";
let html="";
q.options.forEach((opt,i)=>{
let className="option";
if(userAnswers[current]==i) className+=" selected";
html+=`<button class="${className}" onclick="select(${i})">${opt}</button>`;
});
document.getElementById("options").innerHTML=html;
}else{
document.getElementById("options").innerHTML="";
document.getElementById("writtenAnswer").style.display="block";
document.getElementById("writtenAnswer").value=userAnswers[current]||"";
}
}

function select(i){
userAnswers[current]=i;
loadQuestion();
}

function next(){ if(current<allQuestions.length-1){current++;loadQuestion();} }
function prev(){ if(current>0){current--;loadQuestion();} }

function showAnswer(){
let box=document.getElementById("modelAnswer");
box.innerText=allQuestions[current].answer;
box.style.display="block";
}

function submitTest(){
let score=0;
for(let i=0;i<mcqQuestions.length;i++){
if(userAnswers[i]==mcqQuestions[i].answer) score++;
else if(userAnswers[i]!=null) score-=0.25;
}
document.getElementById("result").innerHTML=
"MCQ Score: "+score.toFixed(2)+"/20<br>2 Marks questions are subjective.";
}

// TIMER
let time=45*60;
let timer=document.getElementById("timer");
setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
timer.innerHTML="Time Left: "+m+":"+(s<10?"0"+s:s);
time--;
if(time<0){ alert("Time Over"); submitTest(); }
},1000);

loadQuestion();

</script>

</body>
</html>
