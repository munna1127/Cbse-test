let currentQuestionIndex = 0;
let userAnswers = [];
let submitted = false;

// ================= LOAD QUESTION =================

function loadQuestion() {

if(questions.length === 0) return;

let q = questions[currentQuestionIndex];

document.getElementById("question").innerText = q.q;
document.getElementById("modelAnswer").style.display = "none";
document.getElementById("writtenAnswer").style.display = "none";
document.getElementById("options").innerHTML = "";

// Section title
document.getElementById("sectionTitle").innerText = q.section;

// ===== MCQ =====
if(q.type === "mcq"){

let optionsHTML = "";

q.options.forEach((opt, index) => {

let className = "option";

if(userAnswers[currentQuestionIndex] === index)
className += " selected";

if(submitted){
if(index === q.answer)
className += " correct";

if(userAnswers[currentQuestionIndex] === index && index !== q.answer)
className += " wrong";
}

optionsHTML += `<button class="${className}" onclick="selectOption(${index})">${opt}</button>`;

});

document.getElementById("options").innerHTML = optionsHTML;

}

// ===== LONG ANSWER =====
else {

document.getElementById("writtenAnswer").style.display = "block";

if(submitted){
document.getElementById("modelAnswer").innerText = q.answer;
document.getElementById("modelAnswer").style.display = "block";
}

}

}

// ================= SELECT MCQ OPTION =================

function selectOption(index){

if(submitted) return;

userAnswers[currentQuestionIndex] = index;
loadQuestion();

}

// ================= NAVIGATION =================

function nextQuestion(){

if(currentQuestionIndex < questions.length - 1){
currentQuestionIndex++;
loadQuestion();
}

}

function prevQuestion(){

if(currentQuestionIndex > 0){
currentQuestionIndex--;
loadQuestion();
}

}

// ================= SUBMIT =================

function submitTest(){

submitted = true;

let score = 0;

questions.forEach((q, i) => {

if(q.type === "mcq"){
if(userAnswers[i] === q.answer){
score++;
}
}

});

document.getElementById("result").innerHTML =
"MCQ Score: " + score + " / 20<br>All correct answers are now highlighted.";

loadQuestion();

}

// ================= TIMER (3 HOURS) =================

let time = 180 * 60;

let countdown = setInterval(function(){

let minutes = Math.floor(time / 60);
let seconds = time % 60;

document.getElementById("timer").innerText =
"Time Left: " + minutes + ":" + (seconds < 10 ? "0"+seconds : seconds);

time--;

if(time < 0){
clearInterval(countdown);
submitTest();
alert("Time Over! Test Submitted.");
}

},1000);
