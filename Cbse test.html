<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Class 12 Chemistry Board Mock</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.container{
max-width:1000px;
margin:20px auto;
padding:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:15px;
}

h2{text-align:center;}

#timer{
text-align:center;
font-weight:bold;
color:#00ffcc;
margin-bottom:10px;
}

.option{
display:block;
width:100%;
padding:8px;
margin:6px 0;
border:none;
border-radius:6px;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
}

.option.selected{background:#0072ff;}

textarea{
width:100%;
height:100px;
margin-top:8px;
border-radius:6px;
padding:6px;
}

.answer-box{
display:none;
margin-top:8px;
padding:10px;
background:rgba(0,255,0,0.15);
border-radius:6px;
}

.nav{
text-align:center;
margin-top:10px;
}

.nav button{
padding:8px 15px;
margin:5px;
border:none;
border-radius:6px;
background:#0072ff;
color:white;
cursor:pointer;
}

.result{
margin-top:10px;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>CBSE Class 12 Chemistry Board Pattern Mock Test</h2>
<div id="timer">Time Left: 180:00</div>

<h3 id="question"></h3>
<div id="options"></div>
<textarea id="written" style="display:none;"></textarea>

<div class="answer-box" id="modelAnswer"></div>

<div class="nav">
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="showAnswer()">View Answer</button>
<button onclick="submitTest()">Submit</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

// ================= QUESTIONS =================

let questions=[

// -------- SECTION A (MCQ 20) --------

{type:"mcq",q:"IUPAC name of CH3COOH?",options:["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],answer:1},

{type:"mcq",q:"Oxidation number of S in H2SO4?",options:["+4","+6","+2","+8"],answer:1},

{type:"mcq",q:"Unit of rate constant of first order reaction?",options:["s⁻¹","mol L⁻¹ s⁻¹","L mol⁻¹ s⁻¹","mol²"],answer:0},

{type:"mcq",q:"Strongest acid among following?",options:["HClO","HClO2","HClO3","HClO4"],answer:3},

{type:"mcq",q:"Coordination number in [Co(NH3)6]³⁺?",options:["4","2","6","3"],answer:2},

{type:"mcq",q:"Shape of SF6?",options:["Tetrahedral","Trigonal planar","Octahedral","Square planar"],answer:2},

{type:"mcq",q:"Which shows hydrogen bonding?",options:["NH3","CH4","CO2","CCl4"],answer:0},

{type:"mcq",q:"Order of reaction in Rate = k[A]²?",options:["1","2","3","0"],answer:1},

{type:"mcq",q:"Nernst equation contains log of?",options:["Temperature","Pressure","Reaction quotient","Voltage"],answer:2},

{type:"mcq",q:"Hybridisation in ethene?",options:["sp","sp2","sp3","sp3d"],answer:1},

{type:"mcq",q:"Colligative property depends on?",options:["Nature","Number of particles","Color","Density"],answer:1},

{type:"mcq",q:"SN1 reaction favoured by?",options:["Primary halide","Secondary halide","Tertiary halide","Methyl"],answer:2},

{type:"mcq",q:"Electrophile among following?",options:["NO2+","Cl-","OH-","CN-"],answer:0},

{type:"mcq",q:"Aromatic compound?",options:["Benzene","Ethane","Propane","Cyclohexane"],answer:0},

{type:"mcq",q:"Zero order unit?",options:["mol L⁻¹ s⁻¹","s⁻¹","L mol⁻¹ s⁻¹","mol⁻²"],answer:0},

{type:"mcq",q:"Primary amine is?",options:["RNH2","R2NH","R3N","R4N+"],answer:0},

{type:"mcq",q:"pH of neutral solution?",options:["5","6","7","8"],answer:2},

{type:"mcq",q:"Which is reducing agent?",options:["Li","Na","K","Rb"],answer:0},

{type:"mcq",q:"Electrochemical series arranged by?",options:["Atomic mass","Reduction potential","Boiling point","Density"],answer:1},

{type:"mcq",q:"Crystal field splitting in octahedral gives how many orbitals?",options:["2 and 3","3 and 2","4 and 2","5 and 1"],answer:0},

// -------- SECTION B (2 MARKS) --------

{type:"long",q:"Define rate of reaction with expression.",answer:"Rate of reaction is change in concentration of reactant or product per unit time.\n\nMathematically:\nRate = -d[R]/dt or d[P]/dt\n\nUnit: mol L⁻¹ s⁻¹\nNegative sign used for reactant because its concentration decreases."},

{type:"long",q:"State Nernst equation and define terms.",answer:"Nernst Equation:\nE = E° - (0.0591/n) log Q\n\nE = electrode potential\nE° = standard electrode potential\nn = number of electrons\nQ = reaction quotient\nIt shows effect of concentration on potential."},

{type:"long",q:"Define colligative properties with examples.",answer:"Colligative properties depend only on number of solute particles.\nExamples:\n• Relative lowering of vapour pressure\n• Elevation of boiling point\n• Depression of freezing point\n• Osmotic pressure"},

// (You can add remaining 2,3,5 marks same pattern)

];

let current=0;
let userAnswers=new Array(questions.length).fill(null);

// LOAD QUESTION
function loadQuestion(){
let q=questions[current];
document.getElementById("question").innerText=(current+1)+". "+q.q;
document.getElementById("modelAnswer").style.display="none";

if(q.type=="mcq"){
document.getElementById("written").style.display="none";
let html="";
q.options.forEach((opt,i)=>{
let className="option";
if(userAnswers[current]==i) className+=" selected";
html+=`<button class="${className}" onclick="select(${i})">${opt}</button>`;
});
document.getElementById("options").innerHTML=html;
}else{
document.getElementById("options").innerHTML="";
document.getElementById("written").style.display="block";
}
}

function select(i){
userAnswers[current]=i;
loadQuestion();
}

function next(){if(current<questions.length-1){current++;loadQuestion();}}
function prev(){if(current>0){current--;loadQuestion();}}

function showAnswer(){
let q=questions[current];
if(q.type!="mcq"){
let box=document.getElementById("modelAnswer");
box.innerText=q.answer;
box.style.display="block";
}
}

function submitTest(){
let score=0;
for(let i=0;i<20;i++){
if(userAnswers[i]==questions[i].answer) score++;
}
document.getElementById("result").innerHTML="MCQ Score: "+score+"/20 (No Negative Marking)";
}

// TIMER 3 HOURS
let time=180*60;
let timer=document.getElementById("timer");
setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
timer.innerHTML="Time Left: "+m+":"+(s<10?"0"+s:s);
time--;
if(time<0){alert("Time Over");submitTest();}
},1000);

loadQuestion();

</script>

</body>
</html>
