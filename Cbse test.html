<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Chemistry Mock</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

.container{
    max-width:800px;
    margin:20px auto;
    padding:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:15px;
}

.option{
    display:block;
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,0.1);
    color:white;
}

.option.selected{
    background:#0072ff;
}

.option.correct{
    background:green !important;
}

.option.wrong{
    background:red !important;
}

.nav{
    text-align:center;
    margin-top:15px;
}

.nav button{
    padding:8px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#0072ff;
    color:white;
}

#timer{
    text-align:center;
    color:#00ffcc;
    font-weight:bold;
}

.result{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>CBSE Class 12 Chemistry Mock Test</h2>
<div id="timer">Time Left: 30:00</div>

<h3 id="question"></h3>
<div id="options"></div>

<div class="nav">
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="submitTest()">Submit</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

let questions=[
{
q:"IUPAC name of CH3COOH?",
options:["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],
answer:1
},
{
q:"Maximum oxidation state of Mn?",
options:["+2","+4","+7","+3"],
answer:2
},
{
q:"Unit of molar conductivity?",
options:["Ohm","S cm² mol⁻¹","Volt","Ampere"],
answer:1
},
{
q:"Nernst Equation is?",
options:["E=E°-0.0591/n logQ","PV=nRT","V=IR","H=U+PV"],
answer:0
}
];

let current=0;
let userAnswers=new Array(questions.length).fill(null);
let submitted=false;

function loadQuestion(){
let q=questions[current];
document.getElementById("question").innerText=
(current+1)+". "+q.q;

let optionsHTML="";
q.options.forEach((opt,i)=>{
let className="option";

if(userAnswers[current]==i) className+=" selected";

if(submitted){
if(i==q.answer) className+=" correct";
if(userAnswers[current]==i && i!=q.answer) className+=" wrong";
}

optionsHTML+=`<button class="${className}" onclick="select(${i})">${opt}</button>`;
});

document.getElementById("options").innerHTML=optionsHTML;
}

function select(i){
if(submitted) return;
userAnswers[current]=i;
loadQuestion();
}

function next(){
if(current<questions.length-1){
current++;
loadQuestion();
}
}

function prev(){
if(current>0){
current--;
loadQuestion();
}
}

function submitTest(){
submitted=true;
let score=0;
for(let i=0;i<questions.length;i++){
if(userAnswers[i]==questions[i].answer) score++;
}
let percent=(score/questions.length*100).toFixed(2);
document.getElementById("result").innerHTML=
"Score: "+score+"/"+questions.length+
"<br>Percentage: "+percent+"%";
loadQuestion();
}

// TIMER
let time=30*60;
let timer=document.getElementById("timer");

let countdown=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
timer.innerHTML="Time Left: "+m+":"+(s<10?"0"+s:s);
time--;
if(time<0){
clearInterval(countdown);
alert("Time Over!");
submitTest();
}
},1000);

loadQuestion();

</script>

</body>
</html>
