<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Chemistry Mock - Pro</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.container{
max-width:1000px;
margin:20px auto;
padding:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:15px;
}

#timer{
text-align:center;
color:#00ffcc;
font-weight:bold;
margin-bottom:10px;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
margin-bottom:15px;
}

.palette button{
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
background:gray;
color:white;
}

.palette button.active{ background:#0072ff; }
.palette button.attempted{ background:green; }

.option{
display:block;
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
}

.option.selected{ background:#0072ff; }
.option.correct{ background:green !important; }
.option.wrong{ background:red !important; }

.nav{
text-align:center;
margin-top:10px;
}

.nav button{
padding:8px 15px;
margin:5px;
border:none;
border-radius:6px;
background:#0072ff;
color:white;
cursor:pointer;
}

.result{
text-align:center;
font-size:18px;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>CBSE Class 12 Chemistry Mock Test</h2>
<div id="timer">Time Left: 30:00</div>
<div>Attempted: <span id="attemptedCount">0</span> / 20</div>

<div class="palette" id="palette"></div>

<h3 id="question"></h3>
<div id="options"></div>

<div class="nav">
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="submitTest()">Submit</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

// AUTO FULLSCREEN
document.documentElement.requestFullscreen();

// QUESTIONS (20)
let questions=[ ... ]; // 👈 IMPORTANT: Yahan apna 20 question wala array paste karna (previous message wala)


// SHUFFLE
questions.sort(()=>Math.random()-0.5);

let current=0;
let userAnswers=new Array(questions.length).fill(null);
let submitted=false;

function loadPalette(){
let html="";
questions.forEach((_,i)=>{
let className="";
if(i==current) className+=" active";
if(userAnswers[i]!=null) className+=" attempted";
html+=`<button class="${className}" onclick="goTo(${i})">${i+1}</button>`;
});
document.getElementById("palette").innerHTML=html;
}

function loadQuestion(){
let q=questions[current];
document.getElementById("question").innerText=
(current+1)+". "+q.q;

let optionsHTML="";
q.options.forEach((opt,i)=>{
let className="option";
if(userAnswers[current]==i) className+=" selected";

if(submitted){
if(i==q.answer) className+=" correct";
if(userAnswers[current]==i && i!=q.answer) className+=" wrong";
}

optionsHTML+=`<button class="${className}" onclick="select(${i})">${opt}</button>`;
});

document.getElementById("options").innerHTML=optionsHTML;
loadPalette();
updateAttempted();
}

function select(i){
if(submitted) return;
userAnswers[current]=i;
loadQuestion();
}

function next(){
if(current<questions.length-1){ current++; loadQuestion(); }
}

function prev(){
if(current>0){ current--; loadQuestion(); }
}

function goTo(i){
current=i;
loadQuestion();
}

function updateAttempted(){
let count=userAnswers.filter(a=>a!=null).length;
document.getElementById("attemptedCount").innerText=count;
}

function submitTest(){
submitted=true;
let score=0;

for(let i=0;i<questions.length;i++){
if(userAnswers[i]==questions[i].answer) score+=1;
else if(userAnswers[i]!=null) score-=0.25;
}

let percent=((score/20)*100).toFixed(2);

document.getElementById("result").innerHTML=
"Final Score: "+score.toFixed(2)+" / 20"+
"<br>Percentage: "+percent+"%"+
"<br>Negative Marking: -0.25";

loadQuestion();
}

// TIMER
let time=30*60;
let timer=document.getElementById("timer");

let countdown=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
timer.innerHTML="Time Left: "+m+":"+(s<10?"0"+s:s);
time--;
if(time<0){
clearInterval(countdown);
alert("Time Over!");
submitTest();
}
},1000);

loadQuestion();

</script>

</body>
</html>
