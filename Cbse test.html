<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Chemistry Mock Test</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

.container{
    max-width:800px;
    margin:20px auto;
    padding:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius:15px;
}

h1{text-align:center;}

.question-box{
    margin-top:20px;
}

.options button{
    width:100%;
    margin:8px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:rgba(255,255,255,0.1);
    color:white;
}

.options button:hover{
    background:#00c6ff;
}

.nav-buttons{
    margin-top:15px;
    text-align:center;
}

.nav-buttons button{
    padding:8px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#0072ff;
    color:white;
    cursor:pointer;
}

#timer{
    text-align:center;
    font-weight:bold;
    color:#00ffcc;
}

.result{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>CBSE Class 12 Chemistry Mock</h1>
<div id="timer">Time Left: 60:00</div>

<div class="question-box">
    <h3 id="question"></h3>
    <div class="options" id="options"></div>
</div>

<div class="nav-buttons">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="nextQuestion()">Next</button>
    <button onclick="submitTest()">Submit</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

let questions = [
{
    q:"IUPAC name of CH3COOH?",
    options:["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],
    answer:1
},
{
    q:"Maximum oxidation state shown by Mn?",
    options:["+2","+4","+7","+3"],
    answer:2
},
{
    q:"Unit of molar conductivity?",
    options:["Ohm","S cm2 mol-1","Volt","Ampere"],
    answer:1
},
{
    q:"Which is strongest reducing agent?",
    options:["Li","Na","K","Rb"],
    answer:0
},
{
    q:"Nernst equation is?",
    options:["E=E°-0.0591/n logQ","PV=nRT","V=IR","H=U+PV"],
    answer:0
}
];

let currentQuestion = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);

function loadQuestion(){
    let q = questions[currentQuestion];
    document.getElementById("question").innerText =
    (currentQuestion+1)+". "+q.q;

    let optionsHTML="";
    q.options.forEach((opt,index)=>{
        optionsHTML += `<button onclick="selectOption(${index})">${opt}</button>`;
    });

    document.getElementById("options").innerHTML = optionsHTML;
}

function selectOption(index){
    userAnswers[currentQuestion]=index;
}

function nextQuestion(){
    if(currentQuestion<questions.length-1){
        currentQuestion++;
        loadQuestion();
    }
}

function prevQuestion(){
    if(currentQuestion>0){
        currentQuestion--;
        loadQuestion();
    }
}

function submitTest(){
    score=0;
    for(let i=0;i<questions.length;i++){
        if(userAnswers[i]==questions[i].answer){
            score++;
        }
    }

    document.getElementById("result").innerHTML =
    "Your Score: "+score+" / "+questions.length;
}

// TIMER 60 min
let time=60*60;
let timerDisplay=document.getElementById("timer");

let countdown=setInterval(function(){
    let min=Math.floor(time/60);
    let sec=time%60;
    timerDisplay.innerHTML="Time Left: "+min+":"+(sec<10?"0"+sec:sec);
    time--;
    if(time<0){
        clearInterval(countdown);
        alert("Time Over!");
        submitTest();
    }
},1000);

// AUTO FULLSCREEN
document.documentElement.requestFullscreen();

loadQuestion();

</script>

</body>
</html>
